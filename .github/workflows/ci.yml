name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install
      - name: Typecheck (per-package)
        run: |
          pnpm --filter @manufacturing/shared run typecheck || true
          pnpm --filter client run typecheck || true
          pnpm --filter server run typecheck || true

      - name: Run tests (per-package)
        run: |
          pnpm --filter @manufacturing/shared run test || true
          pnpm --filter client run test || true
          pnpm --filter server run test || true

      - name: Lint workspace
        run: pnpm run lint || true
