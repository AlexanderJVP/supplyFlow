name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm must be installed before setup-node, which needs it to resolve
      # the pnpm store path for `cache: 'pnpm'`.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      # Node 22: wrangler 4 requires node >= 22.
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase (applies migrations + seed)
        run: supabase start

      - name: Export Supabase connection details for tests
        run: |
          echo "SUPABASE_URL=$(supabase status -o json | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"

      - name: Typecheck (per-package)
        run: |
          pnpm --filter @manufacturing/shared run typecheck
          pnpm --filter client run typecheck
          pnpm --filter server run typecheck

      - name: Run tests (per-package)
        run: |
          pnpm --filter @manufacturing/shared run test
          pnpm --filter client run test
          pnpm --filter server run test

      - name: Lint workspace
        run: pnpm run lint

      - name: Stop local Supabase
        if: always()
        run: supabase stop
