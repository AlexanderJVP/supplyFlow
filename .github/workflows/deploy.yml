name: Deploy

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # `secrets` isn't allowed in step-level `if:` conditions -- expose
      # presence as a job-level env var and gate the deploy steps on that.
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      # pnpm must be installed before setup-node, which needs it to resolve
      # the pnpm store path for `cache: 'pnpm'`.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      # Node 22: wrangler 4 requires node >= 22.
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build client
        working-directory: ./client
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: pnpm run build

      - name: Deploy client (Cloudflare Pages)
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        working-directory: ./client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name=manufacturing-platform-client

      - name: Build server
        run: pnpm --filter server run build || echo 'server build not configured'

      - name: Publish Cloudflare Worker
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        working-directory: ./server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
